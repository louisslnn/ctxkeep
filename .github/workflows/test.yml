name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # ctxkeep has no runtime dependencies and ships no lockfile, so there is
      # nothing to install — both scripts run on a bare Node. Keep it that way
      # (see CLAUDE.md: no new runtime deps in src/ or hooks/).

      - name: Unit tests
        run: npm test

      - name: Eval (fidelity gate — non-zero if any critical pattern is lost)
        run: npm run eval
